name = "guild-applications-worker"
main = "src/index.js"
compatibility_date = "2026-04-18"

[observability]
enabled = true

[triggers]
# Runs raid lifecycle often enough that the dashboard closes raids at the configured threshold
# even after Worker/Vercel restarts. The handler is idempotent; Firestore is the source of truth.
crons = ["*/10 * * * *"]

[vars]
GITHUB_OWNER = "LihvoDruida"
GITHUB_REPO = "lihvodruida.github.io"
GUILD_APPLICATIONS_LABEL = "guild-application"
ALLOWED_ORIGINS = "https://lihvodruida.pp.ua,https://www.lihvodruida.pp.ua,https://dashboard.lihvodruida.pp.ua,http://127.0.0.1:4000,http://localhost:4000"
DISCORD_ALLOWED_ROLES = ""
DASHBOARD_URL = "https://dashboard.lihvodruida.pp.ua"
DASHBOARD_PROFILE_LOOKUP_ENDPOINT = "https://dashboard.lihvodruida.pp.ua/api/profile/discord-lookup"
RAID_RULES_URL = "https://discord.com/channels/1449767281453301865/1498719949550784540/1498732894326227024"
ALLOW_DEBUG_QUERY = "0"
PUBLIC_API_CACHE_TTL_SECONDS = "120"
PUBLIC_API_APPLICATIONS_CACHE_SECONDS = "90"
PUBLIC_API_RULES_STATS_CACHE_SECONDS = "60"
PUBLIC_API_SIGNUPS_CACHE_SECONDS = "45"
PUBLIC_API_DISCORD_CHANNELS_CACHE_SECONDS = "900"
PUBLIC_API_CACHE_ALLOW_SHARED_TOKEN = "0"
PUBLIC_API_CACHE_VERSION = "v1"
DISCORD_API_TIMEOUT_MS = "14000"
DASHBOARD_API_TIMEOUT_MS = "9000"
DISCORD_RECRUITMENT_GATEWAY_ENABLED = "1"
DASHBOARD_RECRUITMENT_ADVICE_MESSAGE_ENDPOINT = "https://dashboard.lihvodruida.pp.ua/api/discord/recruitment-advice/message"
DASHBOARD_RECRUITMENT_ADVICE_SCAN_ENDPOINT = "https://dashboard.lihvodruida.pp.ua/api/discord/recruitment-advice?limit=4"
DISCORD_RECRUITMENT_BACKFILL_ENABLED = "1"
DISCORD_RECRUITMENT_BACKFILL_MIN_INTERVAL_MS = "1800000"
DISCORD_RECRUITMENT_BACKFILL_LIMIT = "4"
RAID_DISCORD_DELETE_AFTER_START_HOURS = "4"
RAID_DISCORD_DELETE_AFTER_CLOSE_MINUTES = "60"
FIREBASE_ECO_MODE = "1"
WORKER_RAID_LIFECYCLE_MIN_INTERVAL_MS = "540000"
WORKER_RAID_POLL_CLOSE_DUE_MIN_INTERVAL_MS = "540000"
DASHBOARD_RAID_LIFECYCLE_ENDPOINT = "https://dashboard.lihvodruida.pp.ua/api/raids/lifecycle?limit=20"


[[durable_objects.bindings]]
name = "DISCORD_RECRUITMENT_GATEWAY"
class_name = "DiscordRecruitmentGateway"

[[migrations]]
tag = "v1-discord-recruitment-gateway"
new_sqlite_classes = ["DiscordRecruitmentGateway"]


# Set these via `wrangler secret put ...` in production:
# DISCORD_BOT_TOKEN
# DISCORD_PUBLIC_KEY
# DISCORD_GUILD_ID
# GITHUB_TOKEN
# INTERNAL_PROFILE_LOOKUP_TOKEN
# CF_ACCESS_CLIENT_ID        # Cloudflare Access Service Auth, if dashboard panel is protected
# CF_ACCESS_CLIENT_SECRET    # Cloudflare Access Service Auth, if dashboard panel is protected
# DISCORD_RULES_STATS_TOKEN  # Optional shared token for dashboard stats/signups reads
# RAID_LIFECYCLE_SECRET    # Same value as dashboard RAID_LIFECYCLE_SECRET/CRON_SECRET for scheduled raid lifecycle
# DISCORD_RECRUITMENT_ADVICE_SECRET # Same value as dashboard DISCORD_RECRUITMENT_ADVICE_SECRET

# Rules accept/decline counters and raid-rules signup list. Create once:
# wrangler kv namespace create RULES_STATS
# Then paste the returned id below.
# Raid rules additionally use DASHBOARD_URL and INTERNAL_PROFILE_LOOKUP_TOKEN
# to verify dashboard authorization and main character. If the dashboard panel
# is protected by Cloudflare Access, set CF_ACCESS_CLIENT_ID and
# CF_ACCESS_CLIENT_SECRET as Worker secrets too.
# [[kv_namespaces]]
# binding = "RULES_STATS"
# id = "paste_kv_namespace_id_here"
# Optional for raid announcement buttons when the Discord Interaction Endpoint points to this Worker:
# DASHBOARD_RAID_ACTION_ENDPOINT = "https://dashboard.lihvodruida.pp.ua/api/raids/{raidId}/discord-action"

# Public API edge cache. Create once:
# wrangler kv namespace create PUBLIC_API_CACHE
# Then paste the returned id below.
# [[kv_namespaces]]
# binding = "PUBLIC_API_CACHE"
# id = "paste_public_api_cache_namespace_id_here"
# Optional tuning:
# PUBLIC_API_CACHE_TOKEN should be stored via `wrangler secret put PUBLIC_API_CACHE_TOKEN`.
# PUBLIC_API_CACHE_TTL_SECONDS = "120"
# PUBLIC_API_APPLICATIONS_CACHE_SECONDS = "90"
# PUBLIC_API_RULES_STATS_CACHE_SECONDS = "60"
# PUBLIC_API_SIGNUPS_CACHE_SECONDS = "45"
# PUBLIC_API_DISCORD_CHANNELS_CACHE_SECONDS = "900"
# PUBLIC_API_CACHE_ALLOW_SHARED_TOKEN = "0"
# PUBLIC_API_CACHE_VERSION = "v1"
# DISCORD_API_TIMEOUT_MS = "14000"
# DASHBOARD_API_TIMEOUT_MS = "9000"
# RAID_DISCORD_DELETE_AFTER_START_HOURS = "4"
# RAID_DISCORD_DELETE_AFTER_CLOSE_MINUTES = "60"
# DASHBOARD_RAID_LIFECYCLE_ENDPOINT = "https://dashboard.lihvodruida.pp.ua/api/raids/lifecycle?limit=20"
