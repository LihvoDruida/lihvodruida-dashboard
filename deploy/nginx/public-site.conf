# Install in the existing nginx HTTP context after obtaining both certificates.
# Keep one copy of each server block. Replace the prior public-site blocks.
server {
    listen 80;
    listen [::]:80;
    server_name lihvodruida.pp.ua www.lihvodruida.pp.ua;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://lihvodruida.pp.ua$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lihvodruida.pp.ua;
    ssl_certificate /etc/letsencrypt/live/lihvodruida.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lihvodruida.pp.ua/privkey.pem;
    return 308 https://lihvodruida.pp.ua$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lihvodruida.pp.ua;
    ssl_certificate /etc/letsencrypt/live/lihvodruida.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lihvodruida.pp.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 32k;
    location / {
        set $public_site http://lihvodruida-public-site:3000;
        proxy_pass $public_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}
