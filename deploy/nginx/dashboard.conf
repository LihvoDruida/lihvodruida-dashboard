# ---------------------------------------------------------------------------
# Віртуальний хост панелі.
#
# Заміни guild.lihvodruida.pp.ua на свій домен у трьох місцях:
# server_name (двічі) і шляхи до сертифікатів.
# ---------------------------------------------------------------------------

# Бот — окремий апстрім. Discord стукає тільки сюди; панель за цим шляхом
# більше не приймає взаємодій напряму з інтернету.
upstream bot_upstream {
  server bot:8080;
  keepalive 16;
}

upstream dashboard_upstream {
  # Ім'я сервісу з docker-compose. keepalive прибирає зайвий TCP-handshake
  # на кожен запит — помітно на сторінках із багатьма fetch-ами.
  server dashboard:3000;
  keepalive 32;
}

# --- HTTP: тільки ACME-виклик і редірект на HTTPS ---------------------------
server {
  listen 80;
  listen [::]:80;
  server_name guild.lihvodruida.pp.ua;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS ------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name guild.lihvodruida.pp.ua;

  ssl_certificate     /etc/letsencrypt/live/guild.lihvodruida.pp.ua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/guild.lihvodruida.pp.ua/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # HSTS та решта заголовків безпеки приходять із next.config.mjs.
  # Тут їх свідомо не дублюємо: два джерела правди для CSP і HSTS —
  # найшвидший спосіб отримати конфлікт, який ніхто не помітить.

  limit_req zone=general burst=60 nodelay;
  limit_conn perip 32;

  # Cheap scanner rejection before a request ever reaches Node/Next. These are
  # common automated probes, not application routes. Keep /.well-known free for
  # ACME in the HTTP vhost above.
  location ~ /\.(?!well-known(?:/|$)) {
    limit_req zone=scanner burst=2 nodelay;
    return 404;
  }

  location ~* ^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|adminer|cgi-bin|boaform|actuator|server-status|vendor/phpunit)(?:/|$) {
    limit_req zone=scanner burst=2 nodelay;
    return 404;
  }

  location ~* \.(?:php|asp|aspx|cgi)$ {
    limit_req zone=scanner burst=2 nodelay;
    return 404;
  }

  # Статика Next з хешами в іменах — незмінна, віддаємо на рік.
  location /_next/static/ {
    proxy_pass http://dashboard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Оптимізовані зображення: кеш коротший, бо джерело може змінитись.
  location /_next/image {
    limit_req zone=images burst=30 nodelay;
    proxy_pass http://dashboard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache next_images;
    proxy_cache_key "$scheme|$request_method|$host|$request_uri";
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Mistblossom-Image-Cache $upstream_cache_status always;
  }

  # Вхід і OAuth — окремий, жорсткіший ліміт.
  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/conf.d/proxy-params.inc;
    proxy_pass http://dashboard_upstream;
  }

  # Discord interactions. Цю адресу треба вказати в Discord Developer Portal
  # як Interactions Endpoint URL.
  #
  # Discord чекає ACK за 3 секунди, тому таймаути короткі: краще швидка
  # помилка, ніж «Дія не вдалася» в клієнті. Бот відповідає одразу і
  # пересилає роботу в панель уже після відповіді, тож у ці 3 секунди
  # він вкладається незалежно від того, скільки думає панель.
  # proxy-params.inc уже задає proxy_read_timeout і proxy_send_timeout.
  # Повторне оголошення в тому самому location — не перевизначення, а
  # помилка: nginx падає з `directive is duplicate` і не стартує взагалі.
  # Тому короткі таймаути для Discord виносяться в окремий include, який
  # НЕ включає спільний файл.
  location /discord/interactions {
    include /etc/nginx/conf.d/proxy-params-fast.inc;
    proxy_pass http://bot_upstream;
  }

  # Внутрішній маршрут панелі. Ходити сюди має право лише бот через
  # внутрішню мережу, тому ззовні закриваємо: інакше знаючи URL можна було б
  # надсилати взаємодії в обхід перевірки підпису.
  location /api/discord/interactions {
    deny all;
  }

  location /api/health {
    access_log off;
    include /etc/nginx/conf.d/proxy-params.inc;
    proxy_pass http://dashboard_upstream;
  }

  location / {
    include /etc/nginx/conf.d/proxy-params.inc;
    proxy_pass http://dashboard_upstream;
  }
}
