user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # У логи пишемо реальний IP клієнта (його передає Cloudflare або сам nginx),
  # а не адресу докерівського моста — інакше логи марні для розбору.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  keepalive_timeout 30s;
  keepalive_requests 1000;

  # Discord-embed і Battle.net-відповіді бувають великими; 1 МБ вистачає
  # з запасом, а більше відкриває шлях до дешевого перевантаження.
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Обмеження частоти. Окрема зона для /api/auth/: перебір паролів і
  # спам OAuth-редіректами не мають з'їдати ліміт звичайних сторінок.
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=images:10m rate=12r/s;
  limit_req_zone $binary_remote_addr zone=scanner:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Nginx cache for Next image optimizer output. Remote Discord/WoW avatars are
  # expensive to re-fetch/re-encode on every page view; cache-lock also prevents
  # a thundering herd from spawning duplicate optimizer work.
  proxy_cache_path /var/cache/nginx/next-images levels=1:2 keys_zone=next_images:20m
                   max_size=512m inactive=7d use_temp_path=off;

  # Довіряємо X-Forwarded-* тільки від Cloudflare і локальної мережі.
  # Без цього будь-хто міг би підробити свій IP звичайним заголовком.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  # Cloudflare IPv6 ranges — without them IPv6 visitors were logged/rate-limited
  # as the edge proxy rather than the real client.
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  # Docker bridge/service traffic is trusted only for real_ip normalization; it
  # is deliberately NOT marked as Cloudflare below.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Trust Cloudflare metadata only when the actual TCP peer belongs to a
  # Cloudflare network. Browsers can forge CF-* headers on direct-origin
  # requests, so application security must never use those raw values.
  geo $realip_remote_addr $mistblossom_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
  }

  map $mistblossom_from_cloudflare $mistblossom_trusted_proxy {
    1 cloudflare;
    default "";
  }

  map "$mistblossom_from_cloudflare:$http_cf_ipcountry" $mistblossom_cf_country {
    default "";
    ~^1:([A-Za-z][A-Za-z]|XX|T1)$ $http_cf_ipcountry;
  }

  map "$mistblossom_from_cloudflare:$http_cf_ray" $mistblossom_cf_ray {
    default "";
    ~^1:(.+)$ $http_cf_ray;
  }

  include /etc/nginx/conf.d/*.conf;
}
