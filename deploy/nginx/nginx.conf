user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # У логи пишемо реальний IP клієнта (його передає Cloudflare або сам nginx),
  # а не адресу докерівського моста — інакше логи марні для розбору.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Discord-embed і Battle.net-відповіді бувають великими; 1 МБ вистачає
  # з запасом, а більше відкриває шлях до дешевого перевантаження.
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Обмеження частоти. Окрема зона для /api/auth/: перебір паролів і
  # спам OAuth-редіректами не мають з'їдати ліміт звичайних сторінок.
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  # Довіряємо X-Forwarded-* тільки від Cloudflare і локальної мережі.
  # Без цього будь-хто міг би підробити свій IP звичайним заголовком.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  include /etc/nginx/conf.d/*.conf;
}
